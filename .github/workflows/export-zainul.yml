name: Export Zainul Portfolio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-zainul.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare offline folder
        run: |
          mkdir -p offline/Zainul-Portfolio
          cp zainul/index.html offline/Zainul-Portfolio/index.html
          printf '%s\n'             'ZAINUL PORTFOLIO — OFFLINE COPY'             ''             'Open index.html in a modern browser.'             ''             'The portfolio is self-contained in a single HTML file.'             'Animations, dark mode, and interactive effects work offline.'             'The contact form copies a prepared message to the clipboard and does not send data.'             > offline/Zainul-Portfolio/README.txt
      - name: Upload offline portfolio
        uses: actions/upload-artifact@v4
        with:
          name: Zainul-Portfolio-Offline
          path: offline/Zainul-Portfolio
          if-no-files-found: error
